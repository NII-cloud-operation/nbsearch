version: '3.8'

services:
  solr:
    build:
      context: ./solr
    container_name: nbsearch-solr
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: nbsearch-seaweedfs
    ports:
      - "9000:9000"
    volumes:
      - seaweedfs_data:/data
    environment:
      - AWS_ACCESS_KEY_ID=nbsearchak
      - AWS_SECRET_ACCESS_KEY=nbsearchsk
    command: mini -s3.port=9000 -master.telemetry=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  solr_data:
  seaweedfs_data:
