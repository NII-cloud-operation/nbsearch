version: '3.8'

services:
  solr:
    build:
      context: ./solr
    container_name: nbsearch-solr
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: nbsearch-garage
    ports:
      - "9000:9000"
      - "3903:3903"
    volumes:
      - garage_data:/var/garage
      - ./example/garage.toml:/etc/garage.toml:ro
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=nbsearchak
      - GARAGE_DEFAULT_SECRET_KEY=nbsearchsecretkey
    command: server --single-node --default-access-key
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  solr_data:
  garage_data:
