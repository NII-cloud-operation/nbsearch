name: E2E Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  notebook-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ui-tests/e2e-notebook/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          set -euxo pipefail
          pip install --upgrade pip
          pip install -r ui-tests/e2e-notebook/requirements.txt

      - name: Install Playwright browsers
        run: |
          set -euxo pipefail
          python -m playwright install --with-deps

      - name: Build Docker image
        run: |
          set -euxo pipefail
          docker build -t nbsearch:test .

      - name: Scan E2E image with Trivy
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: nbsearch:test
          scanners: vuln
          vuln-type: os,library
          format: json
          output: trivy-results-nbsearch.json
          exit-code: '0'
          list-all-pkgs: 'true'

      - name: Convert Trivy report to SARIF
        if: github.event_name == 'pull_request'
        env:
          TRIVY_SCANNERS: ''
        run: |
          trivy convert \
            --format sarif \
            --output trivy-results-nbsearch.sarif \
            trivy-results-nbsearch.json

      - name: Render vulnerability summary
        if: github.event_name == 'pull_request'
        env:
          IMAGE: nbsearch:test
          COMMIT: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/ci/render-trivy-report.py \
            --input trivy-results-nbsearch.json \
            --output trivy-report-nbsearch.md \
            --image "$IMAGE" \
            --commit "$COMMIT" \
            --run-url "$RUN_URL"
          tee -a "$GITHUB_STEP_SUMMARY" < trivy-report-nbsearch.md

      - name: Upload vulnerability reports
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan-nbsearch
          path: |
            trivy-results-nbsearch.json
            trivy-results-nbsearch.sarif
            trivy-report-nbsearch.md
          retention-days: 14

      # Fork pull requests receive a read-only token, so their reports remain
      # available in the workflow summary and artifact instead of Code Scanning.
      - name: Upload SARIF to GitHub Code Scanning
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results-nbsearch.sarif
          category: trivy-nbsearch

      - name: Start nbsearch container
        run: |
          set -euxo pipefail
          mkdir -p ui-tests/e2e-notebook/artifacts
          docker run -d \
            --name nbsearch-test \
            -p 8888:8888 \
            nbsearch:test \
            start-notebook.sh --ServerApp.token='test-token' --ServerApp.allow_origin='*'
          sleep 20
          # Health check
          curl --retry 10 --retry-delay 3 --retry-connrefused --fail http://localhost:8888/lab?token=test-token || (docker logs nbsearch-test && exit 1)

      - name: Run notebook E2E tests
        env:
          E2E_TRANSITION_TIMEOUT: '30000'
          E2E_DEFAULT_DELAY: '200'
          JUPYTERLAB_URL: 'http://localhost:8888/lab?token=test-token'
          NOTEBOOK7_URL: 'http://localhost:8888/tree?token=test-token'
        run: |
          set -euxo pipefail
          python ui-tests/e2e-notebook/run_notebooks.py

      - name: Gather Docker logs
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p ui-tests/e2e-notebook/artifacts
          docker logs nbsearch-test > ui-tests/e2e-notebook/artifacts/nbsearch-container.log 2>&1 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            ui-tests/e2e-notebook/artifacts

      - name: Shutdown container
        if: always()
        run: |
          set -euxo pipefail
          docker stop nbsearch-test || true
          docker rm nbsearch-test || true
