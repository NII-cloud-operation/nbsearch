[supervisord]
logfile = /tmp/supervisor-daemon.log
pidfile = /tmp/supervisor.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[inet_http_server]
port = 127.0.0.1:9001

[include]
files = /home/jovyan/conf.d/*.conf

[program:solr]
command=/opt/nbsearch/bin/start-solr.sh
stdout_logfile=/tmp/supervisor-%(program_name)s.log
stderr_logfile=/tmp/supervisor-%(program_name)s.log
autorestart=true
user=jovyan
priority=10

[program:seaweedfs]
# -ip is fixed because the container address changes across restarts; -filer.port avoids Jupyter's 8888
command=/opt/seaweedfs/bin/weed mini -dir=/var/seaweedfs -ip=127.0.0.1 -s3.port=9000 -filer.port=18888 -webdav=false -admin.ui=false -s3.port.iceberg=0 -s3.port.lance=0 -master.telemetry=false
environment=AWS_ACCESS_KEY_ID="%(ENV_SEAWEEDFS_ACCESS_KEY)s",AWS_SECRET_ACCESS_KEY="%(ENV_SEAWEEDFS_SECRET_KEY)s"
stdout_logfile=/tmp/supervisor-%(program_name)s.log
stderr_logfile=/tmp/supervisor-%(program_name)s.log
autorestart=true
user=jovyan
priority=10

[program:lsyncd]
command=lsyncd -nodaemon /home/jovyan/.nbsearch/update-index.lua
stdout_logfile=/tmp/supervisor-%(program_name)s.log
stderr_logfile=/tmp/supervisor-%(program_name)s.log
autorestart=true
user=jovyan
priority=10

[program:initial-index]
command=/opt/nbsearch/bin/build-index.sh
stdout_logfile=/tmp/supervisor-%(program_name)s.log
stderr_logfile=/tmp/supervisor-%(program_name)s.log
autorestart=false
user=jovyan
priority=10
